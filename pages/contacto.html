<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet" />
    <link rel="shortcut icon" href="../assets/logo/logo.png" type="image/x-icon">
    <link rel="stylesheet" href="../css/styles.css" />
    <title>Contacto | Panaderia Juanazo</title>
  </head>
  <body>
    <header>
      <a class="logo" href="../index.html">
        <img src="../assets/logo/logo.png" alt="Logo Panaderia Juanazo" class="logo-img" />
        Panaderia Juanazo
      </a>
      <button class="menu-toggle" aria-label="Abrir menú">
        <span></span>
        <span></span>
        <span></span>
      </button>
      <nav class="header-nav" aria-label="Principal">
        <ul>
          <li><a href="../index.html">Inicio</a></li>
          <li><a href="./productos.html" class="activo">Productos</a></li>
          <li><a href="./carrito.html" class="carrito-icono" aria-label="Ir al carrito"><img width="30" height="30" src="https://img.icons8.com/fuzzy/100/shopping-cart.png" alt="shopping-cart"/><span id="contador-carrito"></span></a></li>
        </ul>
      </nav>
    </header>
    <main>
      <section class="contacto">
        <h1 class="titulo-seccion">Contactanos</h1>
        <form id="form-contacto" class="form-contacto" novalidate>
          <div class="grupo-input">
            <label for="email">Tu email</label>
            <input id="email" type="email" name="email" placeholder="nombre@correo.com" required />
          </div>
          <div class="grupo-input">
            <label for="mensaje">Tu mensaje</label>
            <textarea id="mensaje" name="mensaje" rows="5" placeholder="Contanos en qué podemos ayudarte" required></textarea>
          </div>
          <button class="btn btn-primario" type="submit">Enviar</button>
        </form>
      </section>
    </main>
    <footer>
      <p>Realizado por Juanazo para Talento Tech</p>
      <ul class="footer-list">
        <li><img src="../assets/redes/whatsapp.png" alt="WhatsApp" /></li>
        <li><img src="../assets/redes/social.png" alt="Instagram" /></li>
      </ul>
    </footer>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script type="module" src="../js/contacto.js"></script>
    <script type="module" src="../js/menu_toogle.js"></script>
  </body>
</html>
